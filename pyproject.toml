[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anigen-workflow"
version = "0.1.0"
description = "Traceable image and video production with explicit review gates"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
anigen = "anigen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"anigen.image" = ["templates/*.md"]
